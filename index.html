<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة دانتي في الجحيم | Inferno Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020000;
            --lava-red: #8B0000;
            --hell-orange: #FF3300;
            --text-gold: #D4AF37;
            --text-light: #E0E0E0;
            --card-bg: rgba(18, 3, 3, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(139, 0, 0, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(255, 51, 0, 0.15) 0%, transparent 70%);
        }

        header {
            text-align: center;
            padding: 100px 20px 60px;
            background: linear-gradient(to bottom, rgba(139, 0, 0, 0.5), transparent);
            border-bottom: 3px solid var(--lava-red);
            position: relative;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 3.8rem;
            color: var(--hell-orange);
            text-shadow: 0 0 30px rgba(255, 51, 0, 0.8), 0 0 60px rgba(139, 0, 0, 0.6);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        header p {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--text-gold);
            font-style: italic;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .circle-card {
            background: var(--card-bg);
            border: 2px solid var(--lava-red);
            border-radius: 16px;
            padding: 45px;
            margin-bottom: 60px;
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.3), inset 0 0 20px rgba(255, 51, 0, 0.05);
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .circle-card:hover {
            transform: translateY(-8px);
            border-color: var(--hell-orange);
            box-shadow: 0 0 60px rgba(255, 51, 0, 0.5), inset 0 0 30px rgba(255, 51, 0, 0.1);
        }

        .circle-number {
            font-size: 1.2rem;
            color: var(--hell-orange);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
        }

        /* أيقونة نار متحركة */
        .fire-icon::before {
            content: "🔥";
            animation: flicker 1.5s infinite alternate;
            display: inline-block;
        }

        @keyframes flicker {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff3300); }
            100% { transform: scale(1.2) rotate(5deg); filter: drop-shadow(0 0 15px #ff4500); }
        }

        .circle-title {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            color: var(--text-gold);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
        }

        .circle-desc {
            font-size: 1.25rem;
            line-height: 1.9;
            margin-bottom: 30px;
            color: #d1d1d1;
        }

        /* صندوق اللوحات الفنية والصور */
        .art-box {
            border: 2px dashed rgba(139, 0, 0, 0.8);
            padding: 30px;
            background: rgba(10, 0, 0, 0.8);
            text-align: center;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .art-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,51,0,0.05) 0%, transparent 80%);
            pointer-events: none;
        }

        .art-box h3 {
            color: var(--hell-orange);
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .art-image-placeholder {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #1a0202 0%, #300505 50%, #0d0101 100%);
            border: 1px solid var(--lava-red);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .art-image-placeholder span {
            color: var(--text-gold);
            font-style: italic;
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            padding: 0 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .art-box p {
            color: var(--text-gold);
            font-style: italic;
            font-size: 1.15rem;
            font-family: 'Amiri', serif;
        }

        footer {
            text-align: center;
            padding: 50px;
            background: #010000;
            border-top: 2px solid var(--lava-red);
            color: #888;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>رحلة دانتي في الجحيم</h1>
        <p>"اخلعوا كل أمل يا من تلجون إلى هنا"</p>
